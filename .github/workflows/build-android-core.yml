name: Build Android Native Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-core.yml'
      - 'android-native/**'

permissions:
  contents: read

concurrency:
  group: android-native-core
  cancel-in-progress: true

jobs:
  build-android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Clone pinned FFmpegKitNext
        env:
          FFMPEG_KIT_NEXT_REV: 5e51b2da4c3593c0f2f9b49f53eeb497d93e39d3
        run: |
          git init /tmp/ffmpeg-kit-next
          git -C /tmp/ffmpeg-kit-next remote add origin https://github.com/arthenica/ffmpeg-kit-next.git
          git -C /tmp/ffmpeg-kit-next fetch --depth 1 origin "$FFMPEG_KIT_NEXT_REV"
          git -C /tmp/ffmpeg-kit-next checkout --detach FETCH_HEAD
          echo "Pinned FFmpegKitNext: $(git -C /tmp/ffmpeg-kit-next rev-parse HEAD)"

      - name: Build ARM64 Android FFmpegKitNext
        working-directory: /tmp/ffmpeg-kit-next
        run: |
          ./nix-android.sh -p android-r27d             --arch=arm64-v8a             --enable-gpl             --enable-lib-android-media-codec             --enable-lib-dav1d             --enable-lib-fontconfig             --enable-lib-freetype             --enable-lib-fribidi             --enable-lib-harfbuzz             --enable-lib-libass             --enable-lib-x264             --enable-lib-x265             --enable-lib-libsvtav1

      - name: Show Android bundle
        run: |
          find /tmp/ffmpeg-kit-next/prebuilt -maxdepth 5 -type f \( -name '*.aar' -o -name '*.pom' \) -print

      - name: Upload native Android Maven bundle
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-android-arm64-hardsub
          path: /tmp/ffmpeg-kit-next/prebuilt/bundle-android-aar-24-maven
          retention-days: 30

      - name: Stage native Maven repository for app
        run: |
          rm -rf android-native/libs-maven
          mkdir -p android-native/libs-maven
          cp -a /tmp/ffmpeg-kit-next/prebuilt/bundle-android-aar-24-maven/. android-native/libs-maven/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add bundled fallback font
        run: |
          mkdir -p public/vendor/fallback-fonts
          curl -L --fail --retry 3             -o public/vendor/fallback-fonts/NotoSansSC-Regular.otf             https://raw.githubusercontent.com/notofonts/noto-cjk/165c01b46ea533872e002e0785ff17e44f6d97d8/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          test -s public/vendor/fallback-fonts/NotoSansSC-Regular.otf

      - name: Build web UI for Android assets
        run: |
          npm install
          npm run build
          rm -rf android-native/app/src/main/assets/www
          mkdir -p android-native/app/src/main/assets/www
          cp -a dist/. android-native/app/src/main/assets/www/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android-native :app:assembleDebug --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quick-automatic-hardsub-encoder-android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
