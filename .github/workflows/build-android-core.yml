name: Build Android Native Core Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-core.yml'
      - '.github/core-lock.json'

permissions:
  contents: write

concurrency:
  group: android-native-core-release
  cancel-in-progress: true

jobs:
  build-android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read core lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(jq -er '.tag' .github/core-lock.json)"
          REV="$(jq -er '.ffmpegKitNextCommit' .github/core-lock.json)"
          ASSET="$(jq -er '.android.asset' .github/core-lock.json)"
          SHA_ASSET="$(jq -er '.android.sha256Asset' .github/core-lock.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha_asset=$SHA_ASSET" >> "$GITHUB_OUTPUT"

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Clone pinned FFmpegKitNext
        env:
          FFMPEG_KIT_NEXT_REV: ${{ steps.lock.outputs.rev }}
        run: |
          set -euo pipefail
          git init /tmp/ffmpeg-kit-next
          git -C /tmp/ffmpeg-kit-next remote add origin https://github.com/arthenica/ffmpeg-kit-next.git
          git -C /tmp/ffmpeg-kit-next fetch --depth 1 origin "$FFMPEG_KIT_NEXT_REV"
          git -C /tmp/ffmpeg-kit-next checkout --detach FETCH_HEAD
          test "$(git -C /tmp/ffmpeg-kit-next rev-parse HEAD)" = "$FFMPEG_KIT_NEXT_REV"

      - name: Build ARM64 Android FFmpegKitNext
        working-directory: /tmp/ffmpeg-kit-next
        run: |
          ./nix-android.sh -p android-r27d \
            --arch=arm64-v8a \
            --enable-gpl \
            --enable-lib-android-media-codec \
            --enable-lib-dav1d \
            --enable-lib-fontconfig \
            --enable-lib-freetype \
            --enable-lib-fribidi \
            --enable-lib-harfbuzz \
            --enable-lib-libass \
            --enable-lib-x264 \
            --enable-lib-x265 \
            --enable-lib-libsvtav1

      - name: Pack immutable Android Maven core
        env:
          ASSET: ${{ steps.lock.outputs.asset }}
          SHA_ASSET: ${{ steps.lock.outputs.sha_asset }}
        run: |
          set -euo pipefail
          test -d /tmp/ffmpeg-kit-next/prebuilt/bundle-android-aar-24-maven/com
          mkdir -p /tmp/core-release
          tar -C /tmp/ffmpeg-kit-next/prebuilt/bundle-android-aar-24-maven -czf "/tmp/core-release/$ASSET" .
          (
            cd /tmp/core-release
            sha256sum "$ASSET" > "$SHA_ASSET"
          )

      - name: Publish immutable Android core asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.lock.outputs.tag }}
          ASSET: ${{ steps.lock.outputs.asset }}
          SHA_ASSET: ${{ steps.lock.outputs.sha_asset }}
          REV: ${{ steps.lock.outputs.rev }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Quick Hardsub FFmpeg Core $TAG" \
              --notes "Pinned FFmpegKitNext core for Quick Automatic Hardsub Encoder. Upstream commit: $REV. Assets are immutable and verified by SHA-256." \
              --prerelease || true
          fi
          gh release upload "$TAG" "/tmp/core-release/$ASSET" "/tmp/core-release/$SHA_ASSET" --clobber
          gh release download "$TAG" -p "$ASSET" -p "$SHA_ASSET" -D /tmp/core-verify
          (
            cd /tmp/core-verify
            sha256sum -c "$SHA_ASSET"
          )

      - name: Smoke-build APK against freshly built core
        run: |
          set -euo pipefail
          rm -rf android-native/libs-maven
          mkdir -p android-native/libs-maven
          tar -xzf "/tmp/core-release/${{ steps.lock.outputs.asset }}" -C android-native/libs-maven

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add bundled fallback font
        run: |
          mkdir -p public/vendor/fallback-fonts
          curl -L --fail --retry 3 \
            -o public/vendor/fallback-fonts/NotoSansSC-Regular.otf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/165c01b46ea533872e002e0785ff17e44f6d97d8/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          test -s public/vendor/fallback-fonts/NotoSansSC-Regular.otf

      - name: Build web UI for Android assets
        run: |
          npm install
          npm run build
          rm -rf android-native/app/src/main/assets/www
          mkdir -p android-native/app/src/main/assets/www
          cp -a dist/. android-native/app/src/main/assets/www/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Smoke-build debug APK
        run: gradle -p android-native :app:assembleDebug --stacktrace
