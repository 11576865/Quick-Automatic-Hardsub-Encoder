name: Test frontend
on:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-frontend.yml'
      - 'scripts/check-media-ui.cjs'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-frontend.yml'
      - 'scripts/check-media-ui.cjs'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/ass.test.mjs
      - run: node src/fonts.test.mjs
      - run: node src/font-diagnostics.test.mjs
      - run: node src/input-safety.test.mjs
      - run: node src/ui-shell.test.mjs
      - run: node --test src/media-task.test.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: FFMPEG_INTEGRATION=1 node --test src/media-task.integration.test.mjs
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-media-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-workspace-screenshots
          path: media-workspace-*.png
          if-no-files-found: ignore
