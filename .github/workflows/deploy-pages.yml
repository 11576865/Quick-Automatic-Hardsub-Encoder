name: Deploy Frontend

# Android APK publishing is coupled to this workflow so the page manifest and
# downloadable APK always come from the same commit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'scripts/**'
      - 'public/**'
      - 'android-native/**'
      - '.github/workflows/build-android-apk.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-frontend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reuse latest successful FFmpeg Web core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list --workflow build-core.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Build Core and Deploy run found."
            exit 1
          fi
          rm -rf public/vendor/ffmpeg-kit-next-web
          mkdir -p public/vendor/ffmpeg-kit-next-web
          gh run download "$RUN_ID" -n ffmpeg-kit-next-web-hardsub-core -D public/vendor/ffmpeg-kit-next-web
          test -f public/vendor/ffmpeg-kit-next-web/dist/index.js

      - name: Add bundled fallback font
        run: |
          mkdir -p public/vendor/fallback-fonts
          curl -L --fail --retry 3             -o public/vendor/fallback-fonts/NotoSansSC-Regular.otf             https://raw.githubusercontent.com/notofonts/noto-cjk/165c01b46ea533872e002e0785ff17e44f6d97d8/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          test -s public/vendor/fallback-fonts/NotoSansSC-Regular.otf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

      - name: Wait for matching Android APK and publish it with Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=""
          for attempt in $(seq 1 90); do
            RUN_JSON="$(gh run list \
              --workflow build-android-apk.yml \
              --commit "$GITHUB_SHA" \
              --limit 5 \
              --json databaseId,status,conclusion)"

            RUN_ID="$(printf '%s' "$RUN_JSON" | jq -r '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId // empty')"
            if [ -n "$RUN_ID" ]; then
              break
            fi

            FAILED="$(printf '%s' "$RUN_JSON" | jq -r '[.[] | select(.status == "completed" and .conclusion != "success")] | length')"
            if [ "$FAILED" -gt 0 ]; then
              echo "::error::Matching Android APK workflow completed without success."
              exit 1
            fi

            echo "Waiting for Android APK from commit $GITHUB_SHA (attempt $attempt/90)…"
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Timed out waiting for matching Android APK artifact."
            exit 1
          fi

          rm -rf /tmp/quick-hardsub-apk
          mkdir -p /tmp/quick-hardsub-apk dist/downloads
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name quick-automatic-hardsub-encoder-android-debug \
            --dir /tmp/quick-hardsub-apk

          APK_SRC="/tmp/quick-hardsub-apk/app-debug.apk"
          META_SRC="/tmp/quick-hardsub-apk/app-build-metadata.json"
          APK_DST="dist/downloads/quick-automatic-hardsub-encoder-debug.apk"
          test -s "$APK_SRC"
          test -s "$META_SRC"

          VERSION_CODE="$(jq -er '.versionCode' "$META_SRC")"
          VERSION_NAME="$(jq -er '.versionName' "$META_SRC")"
          PACKAGE_NAME="$(jq -er '.packageName' "$META_SRC")"
          CHANNEL="$(jq -er '.channel' "$META_SRC")"
          SHA256="$(jq -er '.sha256' "$META_SRC")"
          SIGNER_SHA256="$(jq -er '.signerSha256' "$META_SRC")"
          SIZE_BYTES="$(jq -er '.sizeBytes' "$META_SRC")"
          COMMIT_SHA="$(jq -er '.commitSha' "$META_SRC")"
          BUILD_RUN_NUMBER="$(jq -er '.workflowRunNumber' "$META_SRC")"

          test "$PACKAGE_NAME" = "io.github.quickhardsub"
          test "$CHANNEL" = "debug"
          test "$COMMIT_SHA" = "$GITHUB_SHA"
          test "$(sha256sum "$APK_SRC" | awk '{print $1}')" = "$SHA256"
          test "$(stat -c '%s' "$APK_SRC")" = "$SIZE_BYTES"

          cp "$APK_SRC" "$APK_DST"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          APK_URL="https://11576865.github.io/Quick-Automatic-Hardsub-Encoder/downloads/quick-automatic-hardsub-encoder-debug.apk"

          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg packageName "$PACKAGE_NAME" \
            --arg channel "$CHANNEL" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$SHA256" \
            --arg signerSha256 "$SIGNER_SHA256" \
            --arg publishedAt "$PUBLISHED_AT" \
            --arg commitSha "$COMMIT_SHA" \
            --argjson sizeBytes "$SIZE_BYTES" \
            --argjson buildRunNumber "$BUILD_RUN_NUMBER" \
            '{
              versionCode: $versionCode,
              versionName: $versionName,
              packageName: $packageName,
              channel: $channel,
              apkUrl: $apkUrl,
              sha256: $sha256,
              signerSha256: $signerSha256,
              sizeBytes: $sizeBytes,
              publishedAt: $publishedAt,
              commitSha: $commitSha,
              buildRunNumber: $buildRunNumber,
              notes: [
                "网页可直接拉起 Android App，未安装时回退到 APK 下载",
                "App 启动时自动检查更新，也支持手动检查",
                "更新清单绑定实际构建 APK 的版本、SHA-256 与签名摘要"
              ]
            }' > dist/app-update.json

          echo "Published Android $VERSION_NAME (versionCode $VERSION_CODE), signer $SIGNER_SHA256"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
