name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'scripts/**'
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-frontend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reuse latest successful FFmpeg Web core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list --workflow build-core.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Build Core and Deploy run found."
            exit 1
          fi
          rm -rf public/vendor/ffmpeg-kit-next-web
          mkdir -p public/vendor/ffmpeg-kit-next-web
          gh run download "$RUN_ID" -n ffmpeg-kit-next-web-hardsub-core -D public/vendor/ffmpeg-kit-next-web
          test -f public/vendor/ffmpeg-kit-next-web/dist/index.js

      - name: Add bundled fallback font
        run: |
          mkdir -p public/vendor/fallback-fonts
          curl -L --fail --retry 3             -o public/vendor/fallback-fonts/NotoSansSC-Regular.otf             https://raw.githubusercontent.com/notofonts/noto-cjk/165c01b46ea533872e002e0785ff17e44f6d97d8/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          test -s public/vendor/fallback-fonts/NotoSansSC-Regular.otf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
