name: Windows required VVC runtime acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'windows/**'
      - 'src/media-task.js'
      - 'src/media-capabilities.js'
      - 'src/vvc*.mjs'
      - 'scripts/check-vvc-native.ps1'
      - 'scripts/build-vvc-tasks.mjs'
      - 'scripts/install-ci-vvc-toolchain.ps1'
      - '.github/workflows/windows-vvc-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vvc-runtime:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate fixtures and PowerShell syntax
        shell: powershell
        run: |
          node --test src/ffmpeg-help-options.test.mjs src/vvc-required-runtime.test.mjs src/vvc-task.test.mjs src/vvc-capability.test.mjs
          if($LASTEXITCODE -ne 0){throw 'VVC fixture tests failed.'}
          foreach($path in @('scripts/install-ci-vvc-toolchain.ps1','scripts/check-vvc-native.ps1','scripts/check-ffmpeg-help-options.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){throw ($errors | Out-String)}
          }
      - name: Verify actual PowerShell help parser
        shell: powershell
        run: ./scripts/check-ffmpeg-help-options.ps1
      - name: Resolve digest-scoped VVC archive cache key
        id: vvc-asset
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Accept='application/vnd.github+json';'User-Agent'='QHE-VVC-acceptance'}
          if($env:GH_TOKEN){$headers.Authorization='Bearer '+$env:GH_TOKEN}
          $release=Invoke-RestMethod -Uri 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest' -Headers $headers
          $assets=@($release.assets | Where-Object {$_.name -eq 'ffmpeg-master-latest-win64-gpl.zip'})
          if($assets.Count -ne 1){throw 'VVC asset identity is absent or ambiguous.'}
          if([string]$assets[0].digest -match '^sha256:([0-9a-fA-F]{64})$'){
            $digest=$Matches[1].ToLowerInvariant()
          }else{throw 'VVC asset digest is missing or invalid.'}
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "digest=$digest`n", (New-Object System.Text.UTF8Encoding($false)))
      - name: Restore immutable digest-scoped VVC archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qhe-vvc-cache/ffmpeg.zip
          key: qhe-vvc-win64-ffmpeg-${{ steps.vvc-asset.outputs.digest }}
      - name: Fetch or reuse verified libvvenc toolchain
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          QHE_VVC_EXPECTED_SHA256: ${{ steps.vvc-asset.outputs.digest }}
        run: ./scripts/install-ci-vvc-toolchain.ps1
      - name: Require real QP, bitrate and ASS hard-sub bridge outputs
        shell: powershell
        run: |
          $ffmpeg=(Get-Command ffmpeg.exe -ErrorAction Stop).Source
          $ffprobe=(Get-Command ffprobe.exe -ErrorAction Stop).Source
          ./scripts/check-vvc-native.ps1 -Ffmpeg $ffmpeg -Ffprobe $ffprobe -RequireRuntime -IncludeHardsub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vvc-required-runtime-evidence
          path: |
            vvc-native-acceptance.json
            vvc-runtime-evidence/
          if-no-files-found: ignore
          retention-days: 14
