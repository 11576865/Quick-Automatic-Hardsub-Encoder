name: Android Stream Plan v4 emulator runtime acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-native/**'
      - 'src/media-task.js'
      - 'src/media-container.js'
      - 'scripts/build-stream-plan-v4-device-fixture.mjs'
      - 'scripts/build-stream-plan-v4-windows-requests.mjs'
      - 'scripts/verify-stream-plan-v4-device-outputs.mjs'
      - 'scripts/run-android-stream-plan-v4-emulator.sh'
      - '.github/workflows/android-stream-plan-v4-emulator.yml'
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - 'src/media-task.js'
      - 'src/media-container.js'
      - 'scripts/build-stream-plan-v4-device-fixture.mjs'
      - 'scripts/build-stream-plan-v4-windows-requests.mjs'
      - 'scripts/verify-stream-plan-v4-device-outputs.mjs'
      - 'scripts/run-android-stream-plan-v4-emulator.sh'
      - '.github/workflows/android-stream-plan-v4-emulator.yml'

permissions:
  contents: read

jobs:
  android-emulator-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install host FFmpeg and Android platform
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Download pinned Android FFmpeg core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(jq -er '.tag' .github/core-lock.json)
          asset=$(jq -er '.android.asset' .github/core-lock.json)
          checksum=$(jq -er '.android.sha256Asset' .github/core-lock.json)
          mkdir -p /tmp/android-core android-native/libs-maven
          gh release download "$tag" --pattern "$asset" --pattern "$checksum" --dir /tmp/android-core
          (cd /tmp/android-core && sha256sum -c "$checksum")
          tar -C android-native/libs-maven -xzf "/tmp/android-core/$asset"

      - name: Generate canonical runtime fixture assets
        run: |
          set -euo pipefail
          pack="$RUNNER_TEMP/stream-plan-v4-pack"
          requests="$RUNNER_TEMP/stream-plan-v4-runtime-requests.json"
          node scripts/build-stream-plan-v4-device-fixture.mjs "$pack"
          node scripts/build-stream-plan-v4-windows-requests.mjs "$pack" "$requests"
          assets="android-native/app/src/androidTest/assets"
          mkdir -p "$assets"
          cp "$pack/stream-plan-v4-source.mkv" "$assets/stream-plan-v4-source.mkv"
          cp "$pack/burn.ass" "$assets/burn.ass"
          cp "$requests" "$assets/stream-plan-v4-runtime-requests.json"

      - name: Stage production web assets and bundled fallback font
        run: |
          set -euo pipefail
          mkdir -p public/vendor/fallback-fonts
          curl -L --fail --retry 3             -o public/vendor/fallback-fonts/NotoSansSC-Regular.otf             https://raw.githubusercontent.com/notofonts/noto-cjk/165c01b46ea533872e002e0785ff17e44f6d97d8/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          test -s public/vendor/fallback-fonts/NotoSansSC-Regular.otf
          npm install
          npm run build
          rm -rf android-native/app/src/main/assets/www
          mkdir -p android-native/app/src/main/assets/www
          cp -a dist/. android-native/app/src/main/assets/www/
          test -s android-native/app/src/main/assets/www/vendor/fallback-fonts/NotoSansSC-Regular.otf

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run EncodeService matrix on Android emulator and verify exported outputs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/run-android-stream-plan-v4-emulator.sh

      - name: Upload Android emulator runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-stream-plan-v4-emulator-evidence
          path: |
            ${{ runner.temp }}/stream-plan-v4-android-emulator-outputs/
            ${{ runner.temp }}/android-stream-plan-v4-verification.json
            ${{ runner.temp }}/android-stream-plan-v4-instrumentation.txt
            android-native/app/build/reports/androidTests/
            android-native/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
