name: Compile Android media tasks
on:
  pull_request:
    paths: ['android-native/**', '.github/workflows/test-android-task.yml']
  push:
    branches: [main]
    paths: ['android-native/**', '.github/workflows/test-android-task.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download pinned Android core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(jq -er '.tag' .github/core-lock.json)
          asset=$(jq -er '.android.asset' .github/core-lock.json)
          checksum=$(jq -er '.android.sha256Asset' .github/core-lock.json)
          mkdir -p /tmp/android-core android-native/libs-maven
          gh release download "$tag" --pattern "$asset" --pattern "$checksum" --dir /tmp/android-core
          (cd /tmp/android-core && sha256sum -c "$checksum")
          tar -C android-native/libs-maven -xzf "/tmp/android-core/$asset"
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile native service and bridge
        run: gradle -p android-native :app:compileDebugKotlin --stacktrace
