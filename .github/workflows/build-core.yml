name: Build Web Core Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-core.yml'
      - '.github/core-lock.json'

permissions:
  contents: write

concurrency:
  group: web-core-release
  cancel-in-progress: true

jobs:
  build-web-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read core lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(jq -er '.tag' .github/core-lock.json)"
          REV="$(jq -er '.ffmpegKitNextCommit' .github/core-lock.json)"
          ASSET="$(jq -er '.web.asset' .github/core-lock.json)"
          SHA_ASSET="$(jq -er '.web.sha256Asset' .github/core-lock.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha_asset=$SHA_ASSET" >> "$GITHUB_OUTPUT"

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Clone pinned FFmpegKitNext
        env:
          FFMPEG_KIT_NEXT_REV: ${{ steps.lock.outputs.rev }}
        run: |
          set -euo pipefail
          git init /tmp/ffmpeg-kit-next
          git -C /tmp/ffmpeg-kit-next remote add origin https://github.com/arthenica/ffmpeg-kit-next.git
          git -C /tmp/ffmpeg-kit-next fetch --depth 1 origin "$FFMPEG_KIT_NEXT_REV"
          git -C /tmp/ffmpeg-kit-next checkout --detach FETCH_HEAD
          test "$(git -C /tmp/ffmpeg-kit-next rev-parse HEAD)" = "$FFMPEG_KIT_NEXT_REV"

      - name: Build WebAssembly core
        working-directory: /tmp/ffmpeg-kit-next
        run: |
          ./nix-web.sh -p web-wasm32-emscripten --static --enable-gpl \
            --enable-lib-dav1d \
            --enable-lib-fontconfig \
            --enable-lib-freetype \
            --enable-lib-fribidi \
            --enable-lib-harfbuzz \
            --enable-lib-libass \
            --enable-lib-x264 \
            --enable-lib-x265 \
            --enable-lib-libsvtav1

      - name: Pack immutable Web core
        env:
          ASSET: ${{ steps.lock.outputs.asset }}
          SHA_ASSET: ${{ steps.lock.outputs.sha_asset }}
        run: |
          set -euo pipefail
          test -f /tmp/ffmpeg-kit-next/prebuilt/bundle-web-wasm32/ffmpeg-kit-next/dist/index.js
          mkdir -p /tmp/core-release
          tar -C /tmp/ffmpeg-kit-next/prebuilt/bundle-web-wasm32 -czf "/tmp/core-release/$ASSET" ffmpeg-kit-next
          (
            cd /tmp/core-release
            sha256sum "$ASSET" > "$SHA_ASSET"
          )

      - name: Publish immutable Web core asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.lock.outputs.tag }}
          ASSET: ${{ steps.lock.outputs.asset }}
          SHA_ASSET: ${{ steps.lock.outputs.sha_asset }}
          REV: ${{ steps.lock.outputs.rev }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Quick Hardsub FFmpeg Core $TAG" \
              --notes "Pinned FFmpegKitNext core for Quick Automatic Hardsub Encoder. Upstream commit: $REV. Assets are immutable and verified by SHA-256." \
              --prerelease || true
          fi
          gh release upload "$TAG" "/tmp/core-release/$ASSET" "/tmp/core-release/$SHA_ASSET" --clobber
          gh release download "$TAG" -p "$ASSET" -p "$SHA_ASSET" -D /tmp/core-verify
          (
            cd /tmp/core-verify
            sha256sum -c "$SHA_ASSET"
          )
