name: Build Core and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-core
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Clone pinned FFmpegKitNext
        env:
          FFMPEG_KIT_NEXT_REV: 5e51b2da4c3593c0f2f9b49f53eeb497d93e39d3
        run: |
          git init /tmp/ffmpeg-kit-next
          git -C /tmp/ffmpeg-kit-next remote add origin https://github.com/arthenica/ffmpeg-kit-next.git
          git -C /tmp/ffmpeg-kit-next fetch --depth 1 origin "$FFMPEG_KIT_NEXT_REV"
          git -C /tmp/ffmpeg-kit-next checkout --detach FETCH_HEAD
          echo "Pinned FFmpegKitNext: $(git -C /tmp/ffmpeg-kit-next rev-parse HEAD)"

      - name: Build WebAssembly core
        working-directory: /tmp/ffmpeg-kit-next
        run: |
          ./nix-web.sh -p web-wasm32-emscripten --static --enable-gpl \
            --enable-lib-dav1d \
            --enable-lib-fontconfig \
            --enable-lib-freetype \
            --enable-lib-fribidi \
            --enable-lib-harfbuzz \
            --enable-lib-libass \
            --enable-lib-x264 \
            --enable-lib-x265 \
            --enable-lib-libsvtav1

      - name: Install Web core into app
        run: |
          rm -rf public/vendor/ffmpeg-kit-next-web
          mkdir -p public/vendor/ffmpeg-kit-next-web
          cp -a /tmp/ffmpeg-kit-next/prebuilt/bundle-web-wasm32/ffmpeg-kit-next/. public/vendor/ffmpeg-kit-next-web/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build app
        run: |
          npm install
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload reusable core artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-web-hardsub-core
          path: public/vendor/ffmpeg-kit-next-web
          retention-days: 30

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
