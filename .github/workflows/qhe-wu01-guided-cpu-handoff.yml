name: QHE WU01 Guided CPU handoff FFmpeg acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/guided-cpu-compiler-contract.js'
      - 'src/guided-cpu-compiler-contract.test.mjs'
      - 'src/guided-cpu-compiler-contract.integration.test.mjs'
      - 'scripts/check-wu01-browser.cjs'
      - 'scripts/check-wu11-guided-mixed-audio-ui.cjs'
      - 'src/guided-explicit-audio-handoff.js'
      - 'src/guided-explicit-audio-handoff.test.mjs'
      - 'src/media-workspace.js'
      - 'src/media-task.js'
      - 'src/media-verification.js'
      - '.github/workflows/qhe-wu01-guided-cpu-handoff.yml'
  workflow_dispatch:
jobs:
  real-cpu-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg and libass
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -filters | grep ' ass '
          ffmpeg -hide_banner -encoders | grep libx264
      - name: Run source-bound handoff and real FFmpeg tests
        env:
          QHE_WU01_REAL_FFMPEG: '1'
        run: node --test src/guided-cpu-compiler-contract.test.mjs src/guided-cpu-compiler-contract.integration.test.mjs src/guided-explicit-audio-handoff.test.mjs

  real-browser-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend and Chromium
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise actual Guided to Manual DOM and compiled execution request
        run: |
          node scripts/check-wu01-browser.cjs
          node scripts/check-wu11-guided-mixed-audio-ui.cjs
