name: Windows local smoke
on:
  push:
    paths:
      - 'windows/**'
      - 'src/main.js'
      - 'src/style.css'
      - '.github/workflows/windows-local-smoke.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'src/main.js'
      - 'src/style.css'
      - '.github/workflows/windows-local-smoke.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows entry point
        shell: powershell
        run: |
          foreach ($path in @('windows/hardsub_windows.ps1', 'windows/native-bridge.ps1', 'windows/native-backend.ps1', 'windows/output-safety.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
      - name: Install FFmpeg for encoding smoke
        shell: powershell
        run: choco install ffmpeg --yes --no-progress
      - name: Validate native encoder catalog and software fallback
        shell: powershell
        run: |
          . ./windows/native-backend.ps1
          $catalog = @(Get-NativeEncoderCatalog)
          foreach ($name in @('h264_nvenc','hevc_nvenc','av1_nvenc','libx264','libx265','libsvtav1')) {
            if (-not ($catalog | Where-Object Key -eq $name)) { throw "Missing encoder profile: $name" }
          }
          $ffmpeg = (Get-Command ffmpeg.exe).Source
          $ffprobe = (Get-Command ffprobe.exe).Source
          $caps = Get-NativeCapabilities $ffmpeg $ffprobe (Resolve-Path ./windows)
          if (-not $caps.Ffmpeg -or -not $caps.Ffprobe) { throw 'Native FFmpeg/FFprobe detection failed' }
          if (-not $caps.HasAss) { throw 'Runner FFmpeg does not expose the ass filter' }
          foreach ($software in @('libx264','libx265','libsvtav1')) {
            $profile = $catalog | Where-Object Key -eq $software | Select-Object -First 1
            $args = Get-NativeEncoderArguments $profile
            if ($args -notmatch [regex]::Escape($software)) { throw "Wrong encoder args for $software" }
          }
          $actualSoftware = @($caps.Encoders | Where-Object { -not $_.Hardware -and $_.Available })
          if (-not $actualSoftware.Count) { throw 'Installed runner FFmpeg exposes no supported software fallback' }
          if (-not (Get-NativeEncoderProfile $caps 'libx264').Available) { throw 'Expected libx264 fallback is unavailable' }
          # Hosted runners normally have no NVIDIA device. NVENC may be listed by FFmpeg,
          # but Available must stay false unless the one-frame runtime probe succeeds.
          foreach ($hardware in @($caps.Encoders | Where-Object Hardware)) {
            if ($hardware.Available -and -not $hardware.Runtime) { throw "False-positive NVENC availability: $($hardware.Key)" }
          }
      - name: Normalize UTF-16 ASS and validate libass input
        shell: powershell
        run: |
          . ./windows/native-backend.ps1
          $work = Join-Path $env:RUNNER_TEMP 'utf16 ass smoke'
          New-Item -ItemType Directory -Path $work | Out-Null
          $source = Join-Path $work 'source.ass'
          $normalized = Join-Path $work 'subtitle.ass'
          $text = @'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 320
          PlayResY: 240
          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Arial,24,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,1,0,2,10,10,10,1
          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,0:00:00.00,0:00:01.50,Default,,0,0,0,,测试字幕
          '@
          [IO.File]::WriteAllText($source, $text, [Text.Encoding]::Unicode)
          $info = Convert-AssToUtf8Normalized $source $normalized
          if ($info.Encoding -notmatch 'UTF-16 LE') { throw "Unexpected ASS encoding detection: $($info.Encoding)" }
          $bytes = [IO.File]::ReadAllBytes($normalized)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { throw 'Normalized ASS unexpectedly contains UTF-8 BOM' }
          Push-Location $work
          try {
            & ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=black:s=320x240:r=15:d=2' -vf 'ass=subtitle.ass' -c:v libx264 -t 1 'normalized.mkv'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path 'normalized.mkv')) { throw 'Normalized ASS encode output missing' }
          } finally { Pop-Location }

      - name: Validate NVENC runtime probe diagnostics contract
        shell: powershell
        run: |
          . ./windows/native-backend.ps1
          $ffmpeg = (Get-Command ffmpeg.exe).Source
          $result = Test-NvencRuntime $ffmpeg 'h264_nvenc'
          foreach ($name in @('Available','ExitCode','Error','Bytes')) {
            if ($result.PSObject.Properties.Name -notcontains $name) { throw "NVENC probe missing field: $name" }
          }
          if ($result.Available -and $result.Bytes -le 0) { throw 'Successful NVENC probe did not produce encoded bytes' }
          if (-not $result.Available -and $null -eq $result.Error) { throw 'Failed NVENC probe did not preserve diagnostics' }

      - name: Smoke Windows localhost bridge
        shell: powershell
        run: |
          $bridge = Start-Process powershell.exe -PassThru -WindowStyle Hidden -ArgumentList @(
            '-NoProfile',
            '-ExecutionPolicy','Bypass',
            '-File',(Resolve-Path './windows/native-bridge.ps1'),
            '-NoBrowser',
            '-Port','8877',
            '-Token','ci-test-token'
          )
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8877/api/health' -Headers @{
                  'X-Quick-Hardsub-Token'='ci-test-token'
                  'Origin'='http://127.0.0.1:8877'
                } -TimeoutSec 3
                if ($health.backend -eq 'windows-native' -and $health.available) {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) { throw 'Windows Native Bridge did not become ready' }
            if (-not $health.ffmpeg -or -not $health.ffprobe) { throw 'Bridge did not expose FFmpeg/FFprobe' }
            if (-not $health.encoders) { throw 'Bridge did not expose encoder capabilities' }

            $preflight = Invoke-WebRequest -Method Options -Uri 'http://127.0.0.1:8877/api/health' -Headers @{
              'Origin'='https://11576865.github.io'
              'Access-Control-Request-Method'='GET'
              'Access-Control-Request-Headers'='x-quick-hardsub-token'
              'Access-Control-Request-Private-Network'='true'
            } -UseBasicParsing
            if ($preflight.Headers['Access-Control-Allow-Origin'] -ne 'https://11576865.github.io') { throw 'Bridge CORS origin is wrong' }
            if ($preflight.Headers['Access-Control-Allow-Private-Network'] -ne 'true') { throw 'Bridge private-network opt-in is missing' }

            $utf8Body = '{"requestId":"ci","timeSeconds":0.5,"assText":"中文"}'
            $bytes = [Text.Encoding]::UTF8.GetByteCount($utf8Body)
            if ($bytes -le $utf8Body.Length) { throw 'UTF-8 smoke body is not multibyte as expected' }
          } finally {
            if ($bridge -and -not $bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
          }

      - name: Preserve old output until replacement succeeds
        shell: powershell
        run: |
          . ./windows/output-safety.ps1
          $work = Join-Path $env:RUNNER_TEMP 'output safety'
          New-Item -ItemType Directory -Path $work | Out-Null
          $target = Join-Path $work 'finished.mkv'
          $temporary = Join-Path $work 'new.tmp.mkv'
          [IO.File]::WriteAllText($target, 'old')
          [IO.File]::WriteAllBytes($temporary, [byte[]]@())
          try { Publish-VerifiedOutput $temporary $target; throw 'Expected empty-file rejection' }
          catch { if ($_.Exception.Message -eq 'Expected empty-file rejection') { throw } }
          if ([IO.File]::ReadAllText($target) -ne 'old') { throw 'Old output was lost' }
          [IO.File]::WriteAllText($temporary, 'new')
          Publish-VerifiedOutput $temporary $target
          if ([IO.File]::ReadAllText($target) -ne 'new') { throw 'Replacement failed' }
      - name: Encode synthetic video with relative ASS path
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'hard sub smoke'
          New-Item -ItemType Directory -Path $work | Out-Null
          Set-Content -Path (Join-Path $work 'subtitle.ass') -Encoding UTF8 -Value @'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 320
          PlayResY: 240
          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Arial,24,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,1,0,2,10,10,10,1
          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,0:00:00.00,0:00:01.50,Default,,0,0,0,,Sample subtitle
          '@
          & ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=black:s=320x240:r=15:d=2' -c:v libx264 (Join-Path $work 'input video.mp4')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $work
          try {
            & ffmpeg -hide_banner -loglevel error -y -progress progress.txt -i 'input video.mp4' -map 0:v:0 -map '0:a?' -sn -vf 'ass=subtitle.ass' -c:v libx264 -preset medium -crf 22 -c:a copy 'output video.mkv'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path 'output video.mkv') -or -not (Test-Path 'progress.txt')) { exit 1 }
            & ffprobe -v error -show_entries 'stream=codec_name' -of csv=p=0 'output video.mkv'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
